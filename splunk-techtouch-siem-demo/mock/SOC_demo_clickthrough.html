<style>
:root{--bg:#0b1424;--surface:#111f33;--panel:#17283f;--border:#30425a;--ink:#f0f5fa;--muted:#9badc1;--accent:#54d2ae;--blue:#82a9ff;--yellow:#f4c56c;--bad:#ed8f90;--card:#142339}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.65}button,input{font:inherit}header{padding:24px 34px;background:linear-gradient(110deg,#11263f,#0e1930);border-bottom:1px solid var(--border)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}.title{font-size:26px;line-height:1.35;font-weight:800;margin:6px 0}.sub{font-size:13px;color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{font-size:11px;padding:4px 9px;border:1px solid #49647b;border-radius:30px;color:#dce9f7}.chip.accent{border-color:#2a7665;color:#80f0cd}.flag{color:#f4dcb1}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1440px;margin:0 auto;min-height:80vh}.nav{padding:22px 16px;border-right:1px solid var(--border);background:#0d1b2d}.nav strong{display:block;margin:0 12px 12px;font-size:12px;color:var(--muted)}.nav button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;color:#b7c6da;text-align:left;padding:12px 11px;border-radius:10px;cursor:pointer;font-size:13px}.nav button span.dot{border:1px solid #506b80;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;font-size:11px;flex:none}.nav button.active{background:#203953;color:white;font-weight:700}.nav button.active .dot{border-color:var(--accent);color:var(--accent)}.workspace{padding:26px 28px 46px;min-width:0}.top{display:flex;gap:20px;align-items:center;justify-content:space-between}.scene-title{font-size:25px;font-weight:800;margin:6px 0}.desc{color:#b6c8dc;margin:0 0 15px;font-size:14px}.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.9fr);gap:18px}.box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:19px;margin-bottom:18px}.box.muted{background:#111b2d}.box h3{font-size:15px;margin:0 0 10px}.box h4{font-size:12px;margin:16px 0 8px;color:var(--muted);letter-spacing:.05em}.box p{margin:7px 0;font-size:13px}.box ul{font-size:13px;margin:8px 0 3px 18px;padding:0}.highlight{border-left:4px solid var(--accent);background:#182e3e;padding:14px 16px;border-radius:8px;font-size:15px;font-weight:700}.warning{border-left:4px solid var(--yellow);padding:10px 13px;background:#292e34;border-radius:7px;color:#e8d2a1;font-size:12px}.tag{font-size:10px;letter-spacing:.05em;font-weight:800;text-transform:uppercase;color:var(--accent)}.tag.rose{color:var(--bad)}.tag.blue{color:var(--blue)}.pill{background:#203d4b;border:1px solid #236a5b;border-radius:8px;padding:6px 10px;display:inline-block;font-size:12px}.btn{border:0;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700;padding:11px 14px;background:var(--accent);color:#06201b}.btn.secondary{background:#294160;color:#e9f3ff}.btn.disabled{background:#3a5063;color:#7a92a9;cursor:not-allowed}.bar{height:6px;background:#2a3b51;border-radius:8px;overflow:hidden;margin-top:5px}.bar div{height:100%;background:linear-gradient(90deg,#4dabf7,var(--accent))}.small{font-size:12px;color:var(--muted)}code,pre{font-family:ui-monospace,"SFMono-Regular",Consolas,Monaco,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#071523;border:1px solid #2d4156;border-radius:9px;padding:13px;color:#c5e5ed;font-size:11px;line-height:1.65;max-height:270px;overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th{color:#a9bed4;font-size:11px;text-align:left;background:#1b3248}.data-table th,.data-table td{padding:9px 10px;border-bottom:1px solid #2c4359}.data-table tr.good td{background:#163f3b}.data-table tr.hovered:hover td{background:#24455b}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.kpi{background:#1b3048;border:1px solid #344e66;padding:14px;border-radius:10px}.kpi strong{font-size:29px;display:block;line-height:1.15}.kpi span{font-size:11px;color:#b2c5d8}.stat-row{display:grid;grid-template-columns:118px 1fr 45px;gap:10px;align-items:center;margin:11px 0;font-size:12px}.footer{display:flex;align-items:center;justify-content:space-between;margin-top:13px;gap:10px}.panel-title{font-size:13px;font-weight:700;color:#dcebf7;margin:0 0 12px}.seq{border:1px solid #355271;padding:10px;border-radius:10px;margin-top:10px}.seq b{color:var(--accent);font-size:11px}.seq p{font-size:12px}.check{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid #2e4155;font-size:13px}.check input{accent-color:#55dab3;width:17px;height:17px;margin-top:3px}.note{border-top:1px solid #344d66;margin-top:16px;padding-top:14px;font-size:11px;color:#b2c2d4}.note strong{color:#e9d1a0}.meter{width:120px}.progress{width:100%;height:5px;background:#294459;border-radius:5px;overflow:hidden}.progress div{height:100%;background:var(--accent)}.badge{padding:3px 8px;border:1px solid #486d88;border-radius:40px;font-size:11px;color:#c4d4ea}.shapes{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap}.shape{padding:8px 11px;background:#223c53;border:1px solid #40617a;border-radius:8px;font-size:12px}.arrow{color:var(--accent);font-size:17px}.rule{font-size:13px;padding-left:14px;border-left:2px solid var(--accent);margin:6px 0}.case-buttons button{margin-right:5px;margin-bottom:7px;border:1px solid #54718e;border-radius:7px;background:#243d54;color:#c8e0ef;cursor:pointer;padding:7px 12px}.case-buttons button.active{background:#30604f;border-color:var(--accent);color:#fff}@media(max-width:950px){.layout{grid-template-columns:1fr}.nav{border-bottom:1px solid var(--border);border-right:none;display:flex;overflow-x:auto;gap:2px;padding:6px}.nav strong{display:none}.nav button{white-space:nowrap;min-width:126px}.workspace{padding:20px}.two{grid-template-columns:1fr}}@media(max-width:560px){.title{font-size:20px}.scene-title{font-size:20px}.kpis{grid-template-columns:1fr 1fr}.two{gap:0}.nav button{min-width:120px}.workspace{padding:12px}header{padding:18px}}
</style>
</head>
<body>
<header><div class="eyebrow">SCENARIO DEMONSTRATION / OCT 08, 2026</div><div class="title">Splunkを、SOC担当者が使い切る。</div><div class="sub">Splunk Cloud＋SSE × Splunk AI Assistant × テックタッチ AI Hub × テックタッチ（DAP）｜架空ログを用いた操作確認モック（GPT版1.0を1.1に合わせて修正）</div><div class="chips"><span class="chip">Splunk Cloud + SSE（ESなし）</span><span class="chip">AI Assistant：SPL生成・修正</span><span class="chip accent">AI Hub：業務要件・検証・調査支援</span><span class="chip">テックタッチ（DAP）：操作・完遂</span><span class="chip flag">実製品とは未接続</span></div></header>
<div class="layout"><aside class="nav" id="nav"></aside><main class="workspace"><div class="top"><div class="small" id="stepnum"></div><div class="meter"><div class="progress"><div id="percent" style="width:0"></div></div></div></div><h1 class="scene-title" id="scenetitle"></h1><p class="desc" id="scenedesc"></p><div id="screen"></div><div class="footer"><button class="btn secondary" id="prev">← 前のシーン</button><span class="small">37分版（20分版の配分は scenario.md 3.2）</span><button class="btn" id="next">次のシーン →</button></div></main></div>
<script id="model-json" type="application/json">{"before": "| inputlookup demo_auth_events.csv\n| stats count(eval(action=\"failure\")) AS failures count(eval(action=\"success\" AND privileged=\"true\")) AS admin_successes BY src\n| where failures >= 10 AND admin_successes >= 1\n", "cases": [{"id": "A", "ip": "198.51.100.24", "failures": 36, "users": 9, "match": true, "why": "同一IP・同一管理者admin_opsで失敗の後に成功。"}, {"id": "B", "ip": "203.0.113.40", "failures": 18, "users": 1, "match": false, "why": "失敗18件は一人の利用者に集中。異なる5ユーザー条件を満たさない。"}, {"id": "C", "ip": "192.0.2.51", "failures": 12, "users": 6, "match": false, "why": "管理者の成功は失敗より前。前後関係を満たさない。"}, {"id": "D", "ip": "203.0.113.20", "failures": 4, "users": 3, "match": false, "why": "失敗件数と異なるユーザー数が閾値未満。"}], "Q0": "| inputlookup demo_auth_events.csv\n| stats count AS total_events dc(src) AS distinct_srcs dc(user) AS distinct_users\n", "Q1": "| inputlookup demo_auth_events.csv\n| where action=\"failure\"\n| stats count AS fail_count dc(user) AS failed_users BY src\n| sort - fail_count\n", "Q2": "| inputlookup demo_auth_events.csv\n| eval epoch=strptime(event_time,\"%Y-%m-%d %H:%M:%S\")\n| where epoch>=strptime(\"2026-10-08 09:00:00\",\"%Y-%m-%d %H:%M:%S\") AND epoch<strptime(\"2026-10-08 09:15:00\",\"%Y-%m-%d %H:%M:%S\")\n| where action=\"failure\"\n| stats count AS fail_count dc(user) AS failed_users BY src\n| where fail_count>=10 AND failed_users>=5\n| sort - fail_count\n", "Q3": "| inputlookup demo_auth_events.csv\n| eval epoch=strptime(event_time,\"%Y-%m-%d %H:%M:%S\")\n| where epoch>=strptime(\"2026-10-08 09:00:00\",\"%Y-%m-%d %H:%M:%S\") AND epoch<strptime(\"2026-10-08 09:15:00\",\"%Y-%m-%d %H:%M:%S\")\n| eval fail_mark=if(action=\"failure\",1,0), failed_user=if(action=\"failure\",user,null())\n| eventstats sum(fail_mark) AS src_fail_count dc(failed_user) AS src_failed_users BY src\n| sort 0 src user epoch\n| streamstats sum(fail_mark) AS prior_user_failures BY src user\n| where action=\"success\" AND privileged=\"true\" AND prior_user_failures>=1 AND src_fail_count>=10 AND src_failed_users>=5\n| table src user event_time src_fail_count src_failed_users mfa\n", "Q4": "| inputlookup demo_auth_events.csv\n| eval _time=strptime(event_time,\"%Y-%m-%d %H:%M:%S\")\n| timechart span=5m count(eval(action=\"failure\")) AS failures count(eval(action=\"success\")) AS successes\n", "Q5": "index=<認証ログのインデックス> sourcetype=<認証ログのsourcetype> earliest=-15m latest=now\n| eval src=<正規化した接続元IP>, user=<正規化したユーザーID>, action=<successまたはfailureへの正規化>\n| where action=\"failure\"\n| stats count AS fail_count dc(user) AS failed_users BY src\n| where fail_count>=10 AND failed_users>=5\n"}</script>
<script>
const MODEL=JSON.parse(document.getElementById('model-json').textContent);
const scenes=[
 ['S0','提案の目的','02分','機能の説明ではなく、SOC業務を現場で完遂できるかを示す。','社内（架空）'],
 ['S1','Before：改修が止まる','03分','実行できるSPLでも「同じユーザー」「失敗後」という条件が漏れている。','Splunk／社内（架空）'],
 ['S2','AI Hub：依頼を整える','04分','社内SOCルールを参照し、Assistantへ渡す検索要件を具体化。','テックタッチ／AI Hub'],
 ['S3','Assistant＋AI Hub：照合','05分','AssistantがSPL案を作り、AI Hubが業務要件との不一致を指摘。','Splunk AI Assistant／AI Hub'],
 ['S4','Splunk：正解ログで検証','05分','A/B/C/Dの反例を使い、「検索が動く」と「正しい」を区別。','Splunk（検索）'],
 ['S5','テックタッチ：ダッシュボード完成','06分','検索・可視化・保存まで一人で進める。','Splunk（Dashboard Studio）／テックタッチ'],
 ['S6','SSE：検知条件へ展開','04分','SSEを参考に、Cloudの検索・アラート運用へ接続する。','Splunk（SSE・アラート）／テックタッチ'],
 ['S7','AI Hub＋テックタッチ：一次調査','05分','調査の確認漏れを減らし、根拠を上位SOCへ渡す。','Splunk／AI Hub／テックタッチ'],
 ['S8','報告・改善と終了','03分','検証済みの検索と調査を再利用可能なSOCナレッジにする。','社内（架空）／AI Hub'],
];
let current=0,caseId='A',checks=Array(6).fill(false),requestVisible=false,queryVersion='before';
const $=id=>document.getElementById(id);
const card=(body,title)=>`<section class="box">${title?`<h3>${title}</h3>`:''}${body}</section>`;
const code=s=>`<pre>${escapeHtml(s)}</pre>`;
function escapeHtml(s){return (s||'').replace(/[&<>\"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));}
function row(label,content){return `<div class="seq"><b>${label}</b><p>${content}</p></div>`}
const ordinary='本シーンは架空ログによる業務設計・操作モックです。実際のSplunk／AI Hub／テックタッチと通信していません。画面はSplunk Webのデザインを踏襲していません。';
function cover(){return card(`<div class="highlight">「SPLを生成した」から「正しいSOC業務が完成した」へ。</div><p>管理者は認証失敗の監視を依頼。SOC担当者はSPLの確認やダッシュボード改修を自力で進められず、SIベンダーへ依頼していました。</p><div class="shapes"><div class="shape">SOC担当者</div><div class="arrow">→</div><div class="shape">AI Hub：要件整理</div><div class="arrow">→</div><div class="shape">AI Assistant：SPL</div><div class="arrow">→</div><div class="shape">AI Hub：照合</div><div class="arrow">→</div><div class="shape">DAP：実行</div></div><div class="note"><strong>デモのゴール：</strong>認証監視ダッシュボード／検知条件／一次調査報告まで完成。</div>`,'目的')+card(`<h4>観客に説明するポイント</h4><p>「Splunkを否定せず、Splunkの技術をSOC担当者が自社運用へ適用できる状態を作ります。」</p>`,'セリフ');}
function before(){return `<div class="two">${card(`<div class="warning">下記は説明用に故意に条件を省いたSPL。Splunk AI Assistantの実際の回答ではありません。</div>${code(MODEL.before)}<div class="rule">問題①　失敗したアカウント数を見ていない</div><div class="rule">問題②　同じ管理者の失敗 → 成功という前後関係を見ていない</div>`,`検索例`)}${card(`<p>このSPLでは、<strong>AだけでなくCも</strong>一致してしまいます。</p><table class="data-table"><tr><th>ケース</th><th>単純集計</th><th>本来の判定</th></tr><tr><td>A</td><td>候補</td><td>高優先度調査</td></tr><tr><td>C</td><td>候補</td><td>除外（成功が先）</td></tr></table><div class="note">AIで生成したかどうかに関係なく、<strong>業務の判定条件</strong>を照合する必要があります。</div>`,`何が誤るのか`)}</div>`}
const prompt='VPN認証で同一IPから15分に失敗10件以上・異なる失敗ユーザー5件以上を検知し、同じ管理者ユーザーの失敗後に成功があるケースだけを検索したい。ログのフィールドはevent_time,src,user,action,privileged。Splunk AI Assistantへの依頼を作ってください。';
const prepared='対象CSVはdemo_auth_events.csv。event_timeは%Y-%m-%d %H:%M:%S、srcは接続元IP、userはアカウント、actionはfailureまたはsuccess、privilegedはtrue/false。15分で同一IPの失敗10件以上、異なる失敗アカウント5以上に加え、同じIP・同じ管理者ユーザーに失敗があり、その後に成功したレコードを抽出。成功が失敗より前のケースは除外。SPLと処理の説明を作成。';
function req(){return `<div class="two">${card(`<h4>担当者の入力</h4><div class="highlight">${prompt}</div><button class="btn" onclick="requestVisible=true;render()">AI Hubで要件整理</button>${requestVisible?`${row('KB01：ログ辞書','event_time / src / user / action / privilegedを参照')}${row('KB02：判定条件','15分・失敗10件・異なるユーザー5人・同一管理者・時系列')}${row('Assistantへの完成依頼',prepared)}<button class="btn secondary" onclick="copyText(prepared)">依頼文をコピー</button>`:''}`,'AI Hubが依頼文を整える')}${card(`<h4>利用する社内文脈</h4><p>KB01：ログ辞書<br>KB02：検知基準<br>KB03：承認済みSPL</p><div class="note">AI Hubは担当者の代わりに全ての判断を確定するのではなく、組織の判断基準を依頼文へ反映します。</div>`,'根拠と価値')}</div>`}
function compare(){return `<div class="two">${card(`<div class="case-buttons"><button class="${queryVersion==='before'?'active':''}" onclick="queryVersion='before';render()">不足条件のある教材SPL</button><button class="${queryVersion==='after'?'active':''}" onclick="queryVersion='after';render()">条件反映後の検証用SPL</button></div>${code(queryVersion==='before'?MODEL.before:MODEL.Q3)}<button class="btn secondary" onclick="copyText(${queryVersion==='before'?'MODEL.before':'MODEL.Q3'})">SPLをコピー</button>`,'Assistantの出力を業務基準でチェック')}${card(`<h4>AI Hubのチェック</h4><table class="data-table"><tr><th>確認条件</th><th>不足例</th><th>変更後</th></tr><tr><td>失敗10件</td><td>有</td><td>有</td></tr><tr><td>異なる5ユーザー</td><td>無</td><td>有</td></tr><tr><td>同一管理者</td><td>無</td><td>有</td></tr><tr><td>失敗の後に成功</td><td>無</td><td>有</td></tr></table><p class="small">修正依頼をAI Assistantに戻し、出力をSplunkで再検証します。</p><div class="note"><strong>ルール：</strong>実機デモではAssistantの本当の出力を表示。事前準備の不十分な検索を「AIが誤答した」と演出しません。</div>`,'ラストワンマイル')}</div>`}
function cases(){let item=MODEL.cases.find(x=>x.id===caseId);return `${card(`<div class="case-buttons">${MODEL.cases.map(x=>`<button class="${caseId===x.id?'active':''}" onclick="caseId='${x.id}';render()">ケース${x.id}</button>`).join('')}</div><div class="kpis"><div class="kpi"><span>失敗件数</span><strong>${item.failures}</strong></div><div class="kpi"><span>異なる失敗ユーザー</span><strong>${item.users}</strong></div><div class="kpi"><span>高優先度候補</span><strong>${item.match?'該当':'非該当'}</strong></div></div><h4>接続元 ${item.ip}</h4><p>${item.why}</p><div class="note"><strong>期待結果：</strong>Q1はA/B/C/D。Q2はA/C。Q3はAのみ。</div>`,'ケース別の正解データ')}${card(`<h4>Q3：同一管理者・失敗後成功</h4>${code(MODEL.Q3)}<p>このSPLを実行し、出力が<strong>Aのadmin_opsの1行だけ</strong>であることを照合します。</p><button class="btn secondary" onclick="copyText(MODEL.Q3)">Q3をコピー</button>`,'検証用SPL')}`}
function dash(){let max=36;return `${card(`<div class="kpis"><div class="kpi"><span>認証失敗（全4IP）</span><strong>70</strong></div><div class="kpi"><span>接続元IP</span><strong>4</strong></div><div class="kpi"><span>要追加調査（失敗後成功）</span><strong>1</strong></div></div><h4>IP別の認証失敗件数</h4>${MODEL.cases.map(x=>`<div class="stat-row"><span>${x.id}：${x.ip.split('.').slice(0,2).join('.')}.…</span><div class="bar"><div style="width:${100*x.failures/max}%"></div></div><b>${x.failures}</b></div>`).join('')}<div class="two"><section><h4>多数アカウント失敗</h4><span class="pill">A・C</span></section><section><h4>失敗後に同一管理者成功</h4><span class="pill">Aのみ：admin_ops</span></section></div>`,'SOC認証監視ダッシュボード｜架空の完成像')}${card(`<h4>DAPが案内する作業</h4><ol><li>ダッシュボード作成（名前：A社_SOC認証監視_デモ。命名規則の入力チェック）</li><li>Q1の保存検索と棒グラフを設定</li><li>Q2・Q3の結果を表形式で表示</li><li>Q4の時間推移を追加</li><li>検索期間・共有範囲（「自分だけ」なら案内）を確認して保存</li></ol><button class="btn secondary" onclick="copyText(MODEL.Q1)">Q1をコピー</button> <button class="btn secondary" onclick="copyText(MODEL.Q2)">Q2をコピー</button>`,'ガイド')}`}
function sse(){return `<div class="two">${card(`<h4>参考とする検知コンテンツ</h4><p>Splunk Security Essentialsで認証関連の検知コンテンツを確認し、必要ログと既知の誤検知、監視目的を確認します。</p><h4>A社の監視条件（デモ用）</h4><div class="rule">15分以内に同一IPから失敗10回以上</div><div class="rule">異なる失敗アカウント5以上</div><div class="rule">同じ特権アカウントで失敗後成功した場合は追加優先調査</div><p class="warning">固定CSVに対するinputlookupは本番アラートの完成形ではありません。実ログへ置換して運用します。</p>`,'SSE × Splunk Cloud')}${card(`<h4>検知対象</h4><table class="data-table"><tr><th>対象</th><th>候補</th></tr><tr class="good"><td>IP-A</td><td>閾値＋時系列に該当</td></tr><tr><td>IP-C</td><td>閾値のみ、後続成功ではない</td></tr></table><h4>アラートの保存画面で設定するもの（社内基準・架空）</h4><div class="rule">名前：SOC_VPN_複数失敗後の特権成功（命名規則の入力チェック）</div><div class="rule">実行：15分ごと（リアルタイムを選ぶと選び直しを案内）</div><div class="rule">トリガー条件：結果が1件以上</div><div class="rule">抑制：同じsrcで60分（空なら案内）</div><div class="rule">通知先：チームの共有アドレス（個人アドレスなら案内）。「トリガーされたアラートに追加」も付ける</div><h4>アラートから調査へ</h4><p>検知後、一次調査手順（S7）に進みます。ESの検知結果（finding）やMission Controlは使用しません。</p>`,'アラート設計')}</div>`}
const triage=[['アラート時刻・対象','検知時刻、接続元IPと対象アカウントを確認'],['ユーザーの広がり','異なる9アカウントへの失敗を確認'],['同一管理者の時系列','admin_opsの失敗後に認証成功を確認'],['MFA・正規アクセス','MFA、本人利用、正規接続元の確認を依頼'],['追加証跡','ログイン後の操作や端末ログを確認'],['引き継ぎと記録','確認済み事実・未確認事項・上位者連携を記録']];
function investigation(){return `${card(`<div class="pill">SOC-2026-001｜接続元198.51.100.24｜36件／9ユーザー</div><p class="small">入口：Splunkの「トリガーされたアラート」（Activity）または通知メールから、ケースAの検索結果を開く。</p><h4>AI Hubが整理する一次調査</h4><p><b>確認済み：</b>同じ管理者admin_opsで失敗後の成功あり。</p><p><b>追加確認：</b>MFA、正規アクセス、ログイン後の操作、端末証跡。</p><p><b>進め方：</b>SOC上位担当者へ証跡と未確認事項を提示。</p>`,'調査支援')}${card(`<div class="small">DAPチェック：${checks.filter(Boolean).length}/6項目</div><div class="progress"><div style="width:${100*checks.filter(Boolean).length/checks.length}%"></div></div>${triage.map((x,i)=>`<label class="check"><input type="checkbox" ${checks[i]?'checked':''} onchange="checks[${i}]=this.checked;render()"><span><b>${x[0]}</b><br><small>${x[1]}</small></span></label>`).join('')}<div class="note">生成AIは侵害成立を確定しません。調査担当者が証跡と手順を確認します。</div>`,'一次調査の完遂')}</div>`}
function finish(){return `${card(`<div class="highlight">Splunkの分析能力＋AI Assistantの生成支援＋AI Hubの業務適合＋DAPの実行支援</div><h4>完成した成果物</h4><table class="data-table"><tr><th>成果物</th><th>結果</th></tr><tr><td>検証済みSPL</td><td>Q1～Q4、Aのみを抽出する時系列判定</td></tr><tr><td>SOCダッシュボード</td><td>IP別、複数ユーザー、管理者失敗後成功、推移</td></tr><tr><td>検知条件</td><td>Splunk Cloudへ展開する監視基準を整理</td></tr><tr><td>一次調査記録</td><td>${checks.filter(Boolean).length}/6の必須確認ステップ</td></tr><tr><td>改善ナレッジ</td><td>「同一管理者」「前後関係」を承認済みテンプレートへ</td></tr></table><div class="note">これは「置き換え」ではなく、<strong>Splunkを使い続けるための運用能力の拡張</strong>です。</div>`,'最終画面')}${card(`<h4>一次報告（デモ）</h4><p>2026年10月8日、198.51.100.24から36件・9ユーザーの認証失敗を確認し、その後同じ管理者admin_opsの認証成功を確認。MFA・接続元・成功後操作の確認を上位SOCへ依頼。</p><button class="btn secondary" onclick="copyText('確認済み：Aから認証失敗36件／9ユーザー、その後admin_opsで成功。未確認：MFA・正規接続・ログイン後操作。次の対応：上位SOCへ追加調査依頼。')">報告文をコピー</button>`,'報告')}`}
const pages=[cover,before,req,compare,cases,dash,sse,investigation,finish];
function render(){let [label,title,minutes,desc,screen]=scenes[current];$('stepnum').textContent=`${label} / ${minutes} / ${current+1} of 9｜画面：${screen}`;$('percent').style.width=`${(current+1)/scenes.length*100}%`;$('scenetitle').textContent=title;$('scenedesc').textContent=desc;$('nav').innerHTML=`<strong>シナリオ 9シーン</strong>`+scenes.map((x,i)=>`<button class="${i===current?'active':''}" onclick="current=${i};render()"><span class="dot">${i+1}</span><span>${x[1]}</span></button>`).join('');$('screen').innerHTML=pages[current]()+`<div class="note">${ordinary}</div>`;$('prev').disabled=current===0;$('prev').className=current===0?'btn disabled':'btn secondary';$('next').textContent=current===8?'先頭に戻る ↻':'次のシーン →';window.scrollTo({top:0,behavior:'instant'});}
function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>alert('コピーしました')).catch(()=>copyOld(text));}else copyOld(text)}
function copyOld(text){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('コピーしました')}
$('prev').addEventListener('click',()=>{if(current>0){current--;render()}});$('next').addEventListener('click',()=>{current=(current+1)%scenes.length;render()});render();
</script>
</body></html>
