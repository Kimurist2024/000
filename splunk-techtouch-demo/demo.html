<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Splunk × テックタッチ 構想デモ</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<style>
:root{--line:#e2e5ea;--ink:#1f2430;--sub:#5d6573;--mut:#8a919c;--tt:#1a7fc1;--ttd:#12608f;--tts:#e8f3fb;--ai:#5a3ea6;--ais:#f2eefa;--ok:#2c7a4b;--warn:#b5560f;--warns:#fdf1e6;
--critical:#d1453b;--high:#ec7a2e;--medium:#d9a514;--low:#9bb52c;--normal:#3c9a5f;--info:#4a8fd6;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f6f7f9}
body{font-family:"Noto Sans JP","IPAGothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 0}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#f6f7f9}
#scene,#q,#ov{position:absolute;inset:0}
#ov{z-index:10}#q{z-index:15}
.shotchat{position:absolute;right:22px;top:16px;width:590px;z-index:6}
.shotc{position:absolute;left:24px;top:12px;border:1px solid #d0d5dc;border-radius:6px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);background:#fff}.shotc img{display:block}.shotc .bx{position:absolute}
.sw{position:absolute;inset:0;display:flex}
.snav{width:232px;flex:none;background:#fff;border-right:1px solid var(--line);padding:14px 12px}
.sapp{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;margin:4px 6px 16px}
.sapp .sic{width:30px;height:30px;background:#5cb85c;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);position:relative}
.sapp .sic:after{content:">";position:absolute;inset:0;color:#fff;font-weight:700;font-size:22px;display:grid;place-items:center}
.sni{display:flex;align-items:center;gap:12px;font-size:16px;padding:10px 12px;border-radius:6px;color:#2f3540;margin-bottom:2px}
.sni svg{color:#5d6573}.sni.on{background:#f0f2f5;box-shadow:inset 4px 0 0 #3c8a3f;font-weight:500}.sni.on svg{color:#3c8a3f}
.sm2{flex:1;min-width:0;padding:14px 22px;overflow:hidden}
.tl2{font-size:15px;color:var(--ink);padding:4px 6px}.tl2.mut{color:#a0a6b0}
.aib{width:48px;border:1px solid #cfd4db;border-radius:6px;display:grid;place-items:center;color:#e0532f;font-size:20px;background:#fff}
.jbt0{font-size:14.5px;color:var(--ink)}.icb{display:inline-grid;place-items:center;border-radius:4px;padding:1px}
.vtb{display:flex;gap:26px;font-size:14.5px;color:#3a4150;margin:4px 0 8px 14px}
.lgd{font-size:13px;color:#3a4150;line-height:1.9}.lgd b{display:inline-block;width:16px;height:3px;margin-right:6px;vertical-align:middle}
.rdesc{font-size:14.5px;color:#3a4150;margin-bottom:12px;line-height:1.6}
.ul2{color:#1a5fb4;text-decoration:underline}.hlrow td{background:#fbfcfd}
.mono{font-family:"JetBrains Mono","Noto Sans JP",monospace}

/* chapter bar + header */
.chbar{position:absolute;left:30px;top:12px;width:1860px;height:58px;display:flex;gap:10px}
.chi{flex:1;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;padding:0 14px;gap:12px}
.chi .n{width:27px;height:27px;border-radius:50%;border:1.5px solid #9aa1ab;font-size:14px;display:grid;place-items:center;color:#5d6573;flex:none}
.chi.cur{border:2px solid #2c3140}
.chi.cur .n{background:#2c3140;color:#fff;border-color:#2c3140}
.chi.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.chi b{font-size:16px;font-weight:700;display:block;line-height:1.3}.chi small{display:block;font-size:13px;color:var(--sub)}
.hdr{position:absolute;left:30px;top:80px;width:1860px;height:82px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;padding:0 20px}
.hdr .tm{width:124px;border-right:1px solid var(--line);margin-right:22px;flex:none}.hdr .tm b{font-size:30px;font-weight:700;display:block;line-height:1.15}.hdr .tm small{font-size:14px;color:var(--sub)}
.hdr h2{font-size:24px;font-weight:700;line-height:1.3}.hdr p{font-size:16px;color:var(--sub);margin-top:3px}

/* window */
.win{position:absolute;left:30px;top:174px;width:1860px;height:940px;background:#fff;border:1px solid #d9dde3;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.wbar{height:40px;background:#f1f2f4;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:8px;font-size:15px;color:#4a5160}
.wbar i{width:12px;height:12px;border-radius:50%;background:#d3d6db}.wbar span{margin-left:14px}
.sbar{height:46px;background:#16181d;color:#e8eaee;display:flex;align-items:center;padding:0 20px;font-size:15px}
.slogo{font-weight:700;font-size:16px;margin-right:34px;color:#fff;letter-spacing:.2px}.slogo small{font-weight:400;color:#9aa0aa;margin-left:8px;font-size:13px}
.sbar .it{margin-right:24px;color:#c9cdd4}
.sbar .rt{margin-left:auto;display:flex;gap:24px;color:#c9cdd4;align-items:center}
.sbar .find{border:1px solid #4a4f58;border-radius:4px;padding:3px 40px 3px 10px;color:#8f96a1}
.abar{height:44px;background:#2b3038;color:#e9ebef;display:flex;align-items:center;padding:0 10px;font-size:15px}
.abar .nv{padding:0 15px;height:44px;display:flex;align-items:center;color:#cfd4db;position:relative;white-space:nowrap}
.abar .nv.on{color:#fff;font-weight:700}
.abar .nv.on:after{content:"";position:absolute;left:15px;right:15px;bottom:0;height:3px;background:#5cb85c}
.abar .an{margin-left:auto;font-size:17px;font-weight:700;color:#fff;padding-right:14px}
.wbody{position:absolute;left:0;right:0;bottom:0;background:#f7f8fa}
.main{position:absolute;left:0;top:0;width:1400px;bottom:0;padding:16px 26px}
.crumb{font-size:14px;color:var(--sub)}
.h1{font-size:26px;font-weight:700;margin:2px 0 12px;display:flex;align-items:baseline;gap:12px}.h1 small{font-size:16px;font-weight:400;color:var(--sub)}
.box{background:#fff;border:1px solid var(--line);border-radius:8px}
.empty{display:grid;place-items:center;color:var(--sub);font-size:16px;height:150px}

/* chat card */
.chat{display:flex;gap:14px;background:#fff;border:1px solid #d7dbe1;border-radius:10px;padding:14px 18px;box-shadow:0 3px 10px rgba(0,0,0,.06);margin-bottom:14px;position:relative}
.chat .av{width:40px;height:40px;border-radius:50%;background:#e9ecf0;display:grid;place-items:center;font-weight:700;color:#4a5160;flex:none}
.chat .hd{font-size:14px;color:var(--sub)}.chat .hd b{color:var(--ink);font-size:15px;margin-right:10px}
.chat p{font-size:17px;margin-top:2px;line-height:1.55}.chat small{font-size:13px;color:var(--mut)}
.chat .cl{position:absolute;right:16px;top:12px;font-size:13px;color:var(--sub)}

/* launcher */
.lhome{position:absolute;inset:0;display:flex}
.lapps{width:300px;background:#fff;border-right:1px solid var(--line);padding:18px 16px}
.lapps .lt{font-size:14px;color:var(--sub);margin-bottom:10px;font-weight:700}
.la{display:flex;align-items:center;gap:10px;font-size:16px;padding:9px 10px;border-radius:6px}
.ic{width:24px;height:24px;border-radius:6px;flex:none;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.lmain{flex:none;width:1100px;padding:16px 26px}
.ltiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:8px}
.lti{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;height:118px}
.lti b{display:block;font-size:17px;margin-top:10px}.lti span{font-size:14px;color:var(--sub)}
.sect{font-size:15px;color:var(--sub);font-weight:700;margin-top:6px}

/* filters / dropdown */
.filt{display:flex;gap:10px;margin-bottom:14px;position:relative}
.fd{display:inline-flex;align-items:center;gap:10px;height:42px;border:1px solid #cfd4db;border-radius:6px;background:#fff;padding:0 14px;font-size:15px;color:var(--sub)}
.fd b{color:var(--ink);font-weight:500}
.dd{position:absolute;background:#fff;border:1px solid #cfd4db;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.12);padding:6px 0;z-index:5;width:260px}
.dd div{padding:9px 16px;font-size:15px}.dd .cur{background:#f0f2f5;font-weight:700}

/* SA tiles */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.tl{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px 16px;height:124px;position:relative;overflow:hidden}
.tl .nm{font-size:15px;font-weight:700;line-height:1.3;height:40px}
.tl .sc{font-size:36px;font-weight:700;line-height:1.1}
.tl .lb{font-size:13px;color:var(--sub)}
.tl .bar{position:absolute;left:0;right:0;bottom:0;height:6px}
.tl.sel{outline:3px solid #2b3038;outline-offset:-2px}
.epbar{display:flex;align-items:center;gap:14px;background:#fdf1e6;border:1px solid #f3d3b6;border-radius:8px;padding:10px 16px;font-size:16px;margin-bottom:14px}
.epbar b{color:#a34b0c}
.lnk{color:var(--tt);border:1.5px solid transparent;border-radius:6px;padding:2px 8px;font-weight:700}
table{border-collapse:collapse;width:100%}
.kt th{font-size:14px;color:var(--sub);font-weight:500;text-align:left;padding:8px 14px;border-bottom:1px solid var(--line)}
.kt td{font-size:16px;padding:0 14px;height:46px;border-bottom:1px solid #eef0f3}
.sev{display:inline-block;color:#fff;font-size:13px;font-weight:700;border-radius:12px;padding:2px 11px}
.qm{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--tt);color:#fff;font-size:14px;font-weight:700;margin-left:6px;vertical-align:middle}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph b{font-size:17px}

/* Episode review */
.erw{display:flex;gap:16px}
.elist{width:430px;flex:none}
.ec{background:#fff;border:1px solid var(--line);border-left:6px solid;border-radius:8px;padding:10px 14px;margin-bottom:10px}
.ec b{display:block;font-size:15px;line-height:1.45}.ec span{font-size:13.5px;color:var(--sub)}
.ec.sel{outline:2.5px solid #2b3038;outline-offset:-1px}
.edet{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 18px;min-height:560px}
.eid{font-size:14px;color:var(--sub)}.etitle{font-size:21px;font-weight:700;margin:2px 0 4px}
.emeta{font-size:14.5px;color:var(--sub)}
.ectl{display:flex;gap:10px;align-items:center;margin:12px 0 10px;flex-wrap:nowrap}
.sel2{display:inline-flex;align-items:center;gap:8px;border:1px solid #cfd4db;border-radius:6px;padding:0 12px;height:36px;font-size:14.5px;color:var(--sub);background:#fff}
.sel2 b{color:var(--ink);font-weight:500}
.abtn{height:36px;padding:0 16px;border-radius:6px;background:#2b3038;color:#fff;font-size:14.5px;display:inline-grid;place-items:center;font-weight:700}
.abtn.g{background:#fff;color:var(--ink);border:1px solid #cfd4db;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{padding:8px 13px;font-size:15px;color:var(--sub);border-bottom:3px solid transparent}
.tab.on{color:var(--ink);font-weight:700;border-color:#2b3038}
.et td,.et th{padding:8px 10px;font-size:15px;border-bottom:1px solid #eef0f3;text-align:left}
.et th{font-size:13.5px;color:var(--sub);font-weight:500}
.chipe{display:inline-flex;align-items:center;gap:8px;background:#f0f2f5;border-radius:6px;padding:6px 12px;font-size:15px}

/* ITE */
.vit{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.vc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;border-top:5px solid var(--normal)}
.vc span{font-size:14px;color:var(--sub)}.vc b{display:block;font-size:30px;font-weight:700;line-height:1.25}.vc small{font-size:13px;color:var(--sub)}

/* search */
.sbx{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.sin{flex:1;background:#fff;border:1.5px solid #b9c0ca;border-radius:6px;padding:10px 14px;font-size:16px;line-height:1.7;min-height:48px;color:#9aa0aa}
.sin .ln{color:#1f2430;white-space:pre}
.k1{color:#1a5fb4;font-weight:700}.k2{color:#8b3fb0}.k3{color:#b45309}.k4{color:#2f7d32}.pp{color:#9aa0aa}
.tp{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #b9c0ca;border-radius:6px;padding:0 14px;font-size:15px;width:210px;justify-content:space-between}
.sbtn{width:58px;background:#3c8a3f;border-radius:6px;display:grid;place-items:center}
.jobl{display:flex;align-items:center;gap:16px;font-size:14.5px;color:var(--sub);margin:4px 0 8px}
.jobl .ok{color:var(--ok);font-weight:700}
.jobl .ja{margin-left:auto;display:flex;gap:8px}
.jbt{border:1px solid #cfd4db;border-radius:5px;padding:3px 10px;background:#fff;color:var(--ink);font-size:14px}
.titlerow{display:flex;align-items:center;justify-content:space-between}
.titlerow .ra{display:flex;gap:8px}
.rt2 td,.rt2 th{padding:11px 14px;font-size:15.5px;border-bottom:1px solid #eef0f3;text-align:left}
.rt2 th{font-size:14px;color:var(--sub);font-weight:500}
.tag{display:inline-block;font-size:12.5px;background:#eef6ee;color:#2f6b35;border-radius:4px;padding:1px 7px;margin-left:8px;font-weight:500}

/* techtouch panel */
.ttp{position:absolute;right:22px;top:16px;width:432px;background:#fff;border:1px solid #d6dbe2;border-top:5px solid var(--tt);border-radius:10px;box-shadow:0 6px 18px rgba(20,40,70,.12);padding:14px 18px 18px;z-index:3}
.ttp.ai{border-top-color:var(--ai)}
.chip{display:inline-block;background:var(--tt);color:#fff;font-size:14px;font-weight:700;border-radius:20px;padding:2px 12px}
.ai .chip{background:var(--ai)}
.ttp .lbl{font-size:14px;color:var(--sub);margin-left:8px}
.ttp h3{font-size:21px;font-weight:700;margin:10px 0 8px;line-height:1.35}
.ttp .dsc{font-size:15px;color:var(--sub);line-height:1.6;margin-bottom:10px}
.git{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.git b{font-size:16px;display:block}.git span{font-size:13.5px;color:var(--sub)}
.git.on{border:2px solid var(--tt);background:var(--tts)}
.ai .git.on{border-color:var(--ai);background:var(--ais)}
.steps li{list-style:none;display:flex;align-items:center;gap:10px;font-size:15.5px;color:#3a4150;padding:3px 8px;border-radius:6px;height:31px}
.steps .d{width:23px;height:23px;border-radius:50%;border:1.5px solid #b5bbc4;display:grid;place-items:center;font-size:12.5px;color:#6b7280;flex:none}
.steps li.ok .d{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.cur{background:var(--tts);color:var(--ttd);font-weight:700}
.steps li.cur .d{background:var(--tt);border-color:var(--tt);color:#fff}
.ai .steps li.cur{background:var(--ais);color:var(--ai)}.ai .steps li.cur .d{background:var(--ai);border-color:var(--ai)}
.msg{font-size:16.5px;font-weight:700;line-height:1.6;margin:10px 0 8px}
.why{background:var(--tts);border-radius:8px;padding:9px 14px;font-size:14.5px;line-height:1.65;color:#2f4a60;margin-top:6px}
.warn{background:var(--warns);border:1.5px solid #f0b483;border-radius:8px;padding:9px 14px;font-size:15px;line-height:1.65;color:#8a4210;margin:6px 0}
.aibox{background:var(--ais);border-radius:8px;padding:9px 14px;font-size:14.5px;line-height:1.7;color:#3c2c6e;margin-top:8px;white-space:pre-line}
.aibox b{display:block;color:var(--ai);font-size:14px;margin-bottom:1px}
.ttg{background:var(--tts);border-radius:8px;padding:9px 14px;font-size:14.5px;line-height:1.65;color:#2f4a60;margin-top:8px}
.ttg b{display:flex;justify-content:space-between;color:var(--ttd);font-size:14px}
.chk{font-size:14.5px;line-height:1.8;margin-top:8px;color:#2f3a48}
.chk div:before{content:"✓ ";color:var(--ok);font-weight:700}
.rec{border-left:2px solid var(--tts);margin:6px 0 4px 6px;padding-left:12px}
.rec div{font-size:14px;line-height:1.55;margin-bottom:6px;color:#2f3a48}.rec div b{color:var(--ttd);margin-right:8px}
.btns{display:flex;gap:10px;margin-top:14px}
.btn2{border:1px solid #cdd2d9;border-radius:8px;height:46px;padding:0 18px;display:grid;place-items:center;font-size:16px;background:#fff}
.btn1{flex:1;background:var(--tt);color:#fff;border-radius:8px;height:46px;display:grid;place-items:center;font-size:16px;font-weight:700}
.ai .btn1{background:var(--ai)}
.note{font-size:13.5px;color:var(--sub);margin-top:10px;line-height:1.6}
.asst{border:1px dashed #b9c0ca;border-radius:8px;padding:8px 12px;font-size:13.5px;color:#3a4150;line-height:1.6;margin-top:8px}

/* popup */
.dim{position:absolute;left:0;top:0;width:1400px;bottom:0;background:rgba(30,35,45,.38);z-index:4}
.pop{position:absolute;background:#fff;border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.25);border-top:5px solid var(--tt);padding:18px 22px 20px;z-index:6}
.pop h4{font-size:21px;margin:8px 0 8px}
.pop p{font-size:16px;line-height:1.7}
.pop .tbox{background:#f4f6f8;border-radius:8px;padding:10px 14px;font-size:15px;line-height:1.75;margin:6px 0 4px}
.pop ol{padding-left:0}.pop li{list-style:none;font-size:15.5px;line-height:1.65;margin-bottom:4px}

/* overlays */
.ring{position:absolute;border:3px solid var(--tt);border-radius:10px;box-shadow:0 0 0 5px rgba(26,127,193,.16);pointer-events:none}
.ring.ai{border-color:var(--ai);box-shadow:0 0 0 5px rgba(90,62,166,.16)}
.ring.w{border-color:#e07b2a;box-shadow:0 0 0 5px rgba(224,123,42,.18)}
.bal{position:absolute;background:var(--tt);color:#fff;border-radius:8px;padding:9px 16px;font-size:16.5px;font-weight:700;line-height:1.45;box-shadow:0 6px 16px rgba(18,96,143,.3);white-space:nowrap}
.bal.ai{background:var(--ai)}
.bal small{display:block;font-weight:400;font-size:14px;opacity:.95}
.bal:before{content:"";position:absolute;width:14px;height:14px;background:inherit;transform:rotate(45deg)}
.bal.b:before{top:-6px;left:24px}.bal.br:before{top:-6px;right:24px}.bal.t:before{bottom:-6px;left:24px}.bal.l:before{right:-6px;top:16px}.bal.r:before{left:-6px;top:16px}
.tip{position:absolute;background:#fff;border:2px solid var(--tt);border-radius:10px;padding:10px 16px 12px;width:440px;font-size:15.5px;line-height:1.7;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.tip b{display:block;color:var(--ttd);font-size:14px;margin-bottom:2px}
#cap{position:absolute;left:30px;bottom:22px;width:1385px;background:#262a35;border-radius:10px;color:#fff;padding:18px 28px 14px;z-index:20}
#cap .c1{font-size:25px;font-weight:700;line-height:1.45}
#cap .c2{font-size:14px;color:#aab0bb;margin-top:6px}
#cursor{position:absolute;left:0;top:0;width:30px;height:30px;z-index:40;pointer-events:none}
#rip{position:absolute;border:3px solid var(--tt);border-radius:50%;z-index:39;pointer-events:none}

/* cards */
.cardbg{position:absolute;inset:0;background:#fafbfc}
.card{position:absolute;left:260px;width:1400px;background:#fff;border:1px solid var(--line);border-left:7px solid var(--tt);border-radius:8px;padding:44px 52px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.card.ai{border-left-color:var(--ai)}
.card .sm{font-size:17px;color:var(--sub)}
.card h1{font-size:48px;font-weight:700;margin:14px 0 14px;line-height:1.35}
.card h2{font-size:28px;font-weight:500;margin-bottom:16px;color:#2c3140}
.card p{font-size:20px;color:#3a4150;line-height:1.7}
.card .lg{display:flex;gap:28px;font-size:17px;margin-top:20px;color:#3a4150}
.card .lg span{display:inline-flex;align-items:center;gap:8px}
.card .lg i{width:16px;height:16px;border-radius:3px;display:inline-block}

.card .sup{font-size:24px;color:#2c3140;margin-top:4px}
.ag{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.ag div{border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-height:150px}
.ag b{font-size:30px;display:block}.ag strong{font-size:18px;display:block;line-height:1.5;margin-top:4px}.ag span{font-size:14.5px;color:var(--sub)}
.qbg{position:absolute;inset:0;background:rgba(40,44,66,.5)}
.qcard{position:absolute;left:270px;top:400px;width:1390px;background:#fff;border-radius:10px;padding:34px 48px 40px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.qcard .chip{font-size:16px;padding:3px 16px}
.qcard h1{font-size:36px;font-weight:700;margin-top:18px;line-height:1.5}

/* summary */
.sumg{position:absolute;left:30px;top:174px;width:1860px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sbox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 24px}
.sbox h5{font-size:20px;margin-bottom:12px}
.tlx{position:relative;padding-left:4px}
.tlx div{display:flex;gap:18px;margin-bottom:16px}.tlx em{font-style:normal;font-weight:700;width:62px;flex:none;font-size:18px}
.tlx p{font-size:18px;line-height:1.5}.tlx p span{display:block;font-size:15.5px;color:var(--sub)}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cnt div{background:#f4f6f8;border-radius:8px;padding:12px 14px}.cnt b{font-size:44px;display:block;line-height:1.2}.cnt span{font-size:15.5px;color:var(--sub);line-height:1.45;display:block}
.ul div{font-size:17.5px;line-height:1.9}.ul div:before{content:"・"}
.sfn{font-size:15px;color:var(--sub);margin-top:8px;line-height:1.6}

<body>
<div id="stage"><div id="scene"></div><div id="ov"></div><div id="q"></div><div id="cap"><div class="c1"></div><div class="c2"></div></div><div id="rip"></div>
<svg id="cursor" viewBox="0 0 30 30"><path d="M3,2 L3,25 L9,19.5 L13,28 L16.6,26.4 L12.7,18 L20.5,18 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<script>
const NOTE='構想デモ｜画面・サービス名・手順・数値は架空で、実際の製品画面や連携動作を示すものではありません。';
const NOTE_PROOF='Splunk Cloud・テックタッチの実画面（デモ環境）｜ログ・人物・サービス名は架空です。';
const NOTE_REAL='Splunk Cloud・テックタッチの実画面（デモ環境）｜ログ・サービス名・人物は架空です。AI Hub欄は例文（構想）です。';
const SEVC={critical:'var(--critical)',high:'var(--high)',medium:'var(--medium)',low:'var(--low)',normal:'var(--normal)',info:'var(--info)'};
const SEVN={critical:'Critical',high:'High',medium:'Medium',low:'Low',normal:'Normal',info:'Info'};
const sev=s=>`<span class="sev" style="background:${SEVC[s]}">${SEVN[s]}</span>`;
const CH=[['第1章　問い合わせ・状況確認','10:16　デモ①'],['第2章　一次確認・連絡','10:18　デモ②'],['第3章　ログを調べる','10:30　デモ③'],['振り返り','まとめ']];
const HDR=[
 {tm:'10:16',lb:'問い合わせ',t:'問い合わせを受けて、担当サービスの健全性を確認する',d:'業務部門から「10時過ぎから契約照会の画面が遅い」と連絡が入りました。担当者がSplunkを使うのは月に数回です（想定の人物像）。'},
 {tm:'10:18',lb:'障害を確認',t:'障害の一次確認を、社内手順どおりに進めて連絡する',d:'同じ時間帯にエピソードが発生していました。人によって順番がばらつかないよう、社内手順（架空）に沿って確認し、関係者に連絡します。'},
 {tm:'10:30',lb:'専門チームの依頼',t:'ログを調べて、原因の手がかりを専門チームに渡す',d:'専門チーム（架空）から、接続エラーの推移をログで確認するよう依頼がありました。SPLを一から書かず、ひな型を使って調べます。'},
 {tm:'まとめ',lb:'振り返り',t:'問い合わせからログ分析までを、一つの業務の流れで見る',d:'今日の流れと、テックタッチが手当てした場面を振り返ります。どこで、どの支援が効くかを一緒に確かめたい点です。'},
 {tm:'実機',lb:'作り方',t:'ガイドの作り方：Splunk Cloud × テックタッチ（実機）',d:'第3章のガイドは、Splunk Cloud（デモ環境）の実画面の上で作成し、管理画面で公開しました。ログは架空のサンプルデータです。'}];

const SERVICES=[
 {id:'contract',n:'契約照会サービス（架空）',s:38,sev:'high'},
 {id:'kanri',n:'契約管理サービス（架空）',s:58,sev:'medium'},
 {id:'agent',n:'代理店ポータル（架空）',s:71,sev:'low'},
 {id:'mypage',n:'顧客マイページ（架空）',s:96,sev:'normal'},
 {id:'auth',n:'認証基盤（架空）',s:100,sev:'normal'},
 {id:'report',n:'帳票出力（架空）',s:92,sev:'normal'}];
const RISE=[10,10,11,10,11,10,11,12,11,13,20,30,34,33,35],FLAT=[20,21,20,19,21,20,21,20,20,21,20,21,20,21,20],MILD=[10,11,10,12,11,12,13,12,14,13,15,14,16,15,16];
const KPIS={
 contract:[{n:'応答時間（p95）',v:'1,850 ms',s:'high',p:RISE,bad:1},{n:'DB接続待ち時間',v:'640 ms',s:'high',p:RISE,bad:1},{n:'エラー率',v:'0.8 %',s:'medium',p:MILD},{n:'リクエスト数',v:'6,200 件／15分',s:'normal',p:FLAT}],
 kanri:[{n:'応答時間（p95）',v:'720 ms',s:'medium',p:MILD},{n:'バッチ処理の遅延',v:'4 分',s:'low',p:MILD},{n:'エラー率',v:'0.1 %',s:'normal',p:FLAT},{n:'リクエスト数',v:'1,900 件／15分',s:'normal',p:FLAT}]};

function spark(vals,w=200,h=32,col='#4a5160'){
 const mn=Math.min(...vals),mx=Math.max(...vals)||1,r=(mx-mn)||1;
 const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(' ');
 return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"/></svg>`;}

/* ---------- top-level pieces ---------- */
function chbar(ch){return `<div class="chbar">${CH.map((c,i)=>`<div class="chi ${i<ch?'done':i===ch?'cur':''}"><span class="n">${i<ch?'✓':i+1}</span><div><b>${c[0]}</b><small>${c[1]}</small></div></div>`).join('')}</div>`;}
function hdr(ch){const h=HDR[ch];return `<div class="hdr"><div class="tm"><b>${h.tm}</b><small>${h.lb}</small></div><div><h2>${h.t}</h2><p>${h.d}</p></div></div>`;}
function abar(st){
 if(st.view==='launcher'||st.view==='search')return '';
 let nav,an;
 if(st.view==='sa'||st.view==='er'){an='IT Service Intelligence';nav=[['Service Analyzer ▾',st.view==='sa'],['Episode Review',st.view==='er','navER'],['Glass Tables'],['Deep Dives'],['Dashboards ▾'],['Search ▾'],['Configuration ▾']];}
 else if(st.view==='ite'){an='IT Essentials Work';nav=[['Entity Overview',1],['Search ▾'],['Configuration ▾']];}
 else{an='Search & Reporting';nav=[['Search',st.sv!=='reports'],['Analytics'],['Datasets'],['Reports',st.sv==='reports','navReports'],['Alerts'],['Dashboards']];}
 return `<div class="abar">${nav.map(n=>`<span class="nv ${n[1]?'on':''}" ${n[2]?`data-k="${n[2]}"`:''}>${n[0]}</span>`).join('')}<span class="an">${an}</span></div>`;}
function win(st){
 if(st.view==='shot'){const sz=IMGSZ[st.shot]||{w:1280,h:800},H=720,W=Math.min(1810,Math.round(sz.w*H/sz.h)),L=st.tt||st.chat||st.chat2?24:Math.round((1858-W)/2);
  const bx=Object.entries(REAL_BOXES[st.shot]||{}).map(([k,b])=>`<div class="bx" data-k="${k}" style="left:${b[0]/sz.w*W}px;top:${b[1]/sz.h*H}px;width:${b[2]/sz.w*W}px;height:${b[3]/sz.h*H}px"></div>`).join('');
  return `<div class="win"><div class="wbar"><i></i><i></i><i></i><span>${st.wtitle||'Splunk Cloud Platform 実画面（デモ環境・架空データ）　テックタッチ（実機・公開中のガイドを再生）'}</span></div>
  <div class="wbody" style="top:40px"><div class="shotc" style="left:${L}px;width:${W}px;height:${H}px"><img src="${SHOTDIR}${st.shot}" style="width:${W}px;height:${H}px">${bx}</div>${st.chat||st.chat2?`<div class="shotchat">${chat(CHATS[st.chat||st.chat2])}</div>`:''}${tt(st.tt)}</div></div>`;}
 const top=st.view==='launcher'||st.view==='search'?86:130;
 return `<div class="win"><div class="wbar"><i></i><i></i><i></i><span>監視画面（架空）　Splunk の画面イメージを踏襲</span></div>
 <div class="sbar"><div class="slogo">Splunk Cloud Platform<small>画面イメージ</small></div><span class="it">Apps ▾</span><div class="rt"><span>Messages ▾</span><span>Settings ▾</span><span>Activity ▾</span><span>Help ▾</span><span class="find">Find</span></div></div>
 ${abar(st)}<div class="wbody" style="top:${top}px"><div class="main">${VIEWS[st.view](st)}</div>${st.pop?'<div class="dim"></div>'+POPS[st.pop]():''}${tt(st.tt)}</div></div>`;}
function chat(c){return `<div class="chat" data-k="chat"><div class="av">${c.a}</div><div><div class="hd"><b>${c.who}</b>${c.tm}</div><p>${c.t}</p><small>社内チャット（架空）の通知</small></div><span class="cl">閉じる</span></div>`;}
const CHATS={
 biz:{a:'業',who:'業務部門（架空）',tm:'10:16',t:'10時過ぎから、契約照会の画面が遅いという声が出ています。状況を確認してもらえますか？'},
 exp:{a:'専',who:'専門チーム（架空）',tm:'10:30',t:'接続エラーの件数を、5分ごとの推移で共有してください。SPLはレポートに保存してある「接続エラーの推移（標準）」を使ってください。'},
 rep:{a:'専',who:'専門チーム（架空）',tm:'10:34',t:'確認しました。接続プールの設定をこちらで確認します。この検索はレポートとして保存し、運用チームに共有してください。'}};

/* ---------- views ---------- */
const VIEWS={
launcher(st){
 const apps=[['Search & Reporting','#3c8a3f','S','appSearch'],['IT Service Intelligence','#1b6ec2','I','appITSI'],['IT Essentials Work','#6b4fbf','E','appITE'],['Cloud Monitoring Console','#7a828e','C']];
 return `<div class="lhome"><aside class="lapps"><div class="lt">Apps</div>${apps.map(a=>`<div class="la"><span class="ic" style="background:${a[1]}">${a[2]}</span>${a[0]}</div>`).join('')}<div class="la" style="color:var(--sub)">＋ Find more apps</div></aside>
 <section class="lmain">${st.chat?chat(CHATS[st.chat]):''}<div class="crumb">Home</div><div class="h1">Home <small>ホーム</small></div><div class="sect">最近使ったアプリ</div>
 <div class="ltiles">${[['IT Service Intelligence','サービスの健全性を見る','#1b6ec2','I','tileITSI'],['Search & Reporting','ログを検索する','#3c8a3f','S'],['IT Essentials Work','サーバーなどの状態を見る','#6b4fbf','E'],['Dashboards','チームのダッシュボード','#7a828e','D']].map(t=>`<div class="lti" ${t[4]?`data-k="${t[4]}"`:''}><span class="ic" style="background:${t[2]};width:30px;height:30px">${t[3]}</span><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div>
 <div style="margin-top:16px;color:var(--sub);font-size:14px">ホーム画面は架空です。</div></section></div>`;},
sa(st){
 const sel=st.saSel;
 let h=`<div class="crumb">IT Service Intelligence ＞ Service Analyzer</div><div class="h1">Service Analyzer <small>サービスの健全性（Tile view）</small></div>
 <div class="filt"><div class="fd">View　<b>Tile ▾</b></div><div class="fd" data-k="saTime">🕘 Time range　<b>${st.saTime}</b> ▾</div><div class="fd">Services　<b>All (6)</b> ▾</div>
 ${st.drop==='saTime'?`<div class="dd" style="left:124px;top:48px">${['Last 15 minutes','Last 60 minutes','Last 4 hours','Last 24 hours'].map(o=>`<div class="${o===st.saTime?'cur':''}" ${o==='Last 60 minutes'?'data-k="opt60"':''}>${o}</div>`).join('')}</div>`:''}</div>
 <div class="tiles" data-k="tiles">${SERVICES.map(s=>`<div class="tl ${sel===s.id?'sel':''}" data-k="tile_${s.id}"><div class="nm">${s.n}</div><div class="sc" style="color:${SEVC[s.sev]}">${s.s}</div><div class="lb">Health score</div><div class="bar" style="background:${SEVC[s.sev]}"></div></div>`).join('')}</div>`;
 if(sel==='contract') h+=`<div class="epbar"><b>進行中のエピソード</b><span>E-0412　契約照会サービス（架空）の応答時間の悪化（10:02〜・New）</span><span class="lnk" data-k="epLink" style="margin-left:auto">Episode Review で開く ›</span></div>`;
 if(sel){const S=SERVICES.find(s=>s.id===sel),K=KPIS[sel];
  h+=`<div class="box"><div class="ph"><b>KPI　${S.n}</b><span style="font-size:15px"><span data-k="hsWrap">Health score <b style="color:${SEVC[S.sev]};font-size:20px">${S.s}</b> ${sev(S.sev)}<span class="qm" data-k="hsQ">?</span></span></span></div>
  <table class="kt"><tr><th style="width:34%">KPI</th><th>現在値</th><th>Severity</th><th>推移（${st.saTime}）</th></tr>
  ${K.map((k,i)=>`<tr ${k.bad&&i===0?'data-k="kpiBad1"':''} ${k.bad&&i===1?'data-k="kpiBad2"':''}><td>${k.n}</td><td><b>${k.v}</b></td><td>${sev(k.s)}</td><td>${spark(k.p,200,30,SEVC[k.s])}</td></tr>`).join('')}</table></div>`;}
 else h+=`<div class="box empty">サービスを選ぶと、KPI（重要業績評価指標）の状態が表示されます。</div>`;
 return h;},
er(st){
 const eps=[{id:'E-0412',t:'契約照会サービス（架空）の応答時間の悪化',m:`${st.erStatus}・${st.erOwner}・10:02〜・イベント 38`,s:'high',sel:1},
  {id:'E-0409',t:'帳票出力（架空）のジョブ遅延',m:'In Progress・運用B（架空）・08:41〜・イベント 12',s:'medium'},
  {id:'E-0405',t:'認証基盤（架空）の証明書期限の通知',m:'Resolved・運用A（架空）・前日・イベント 3',s:'low'}];
 const tabs=[['Impact','tabImpact'],['Events Timeline'],['Common Fields'],['Comments'],['Activity'],['All Events','tabEvents']];
 let body='';
 if(st.erTab==='impact') body=`<div style="font-size:15px;font-weight:700;margin-bottom:6px">影響を受けているサービス</div>
  <table class="et"><tr><th>サービス</th><th>Health score</th><th>Severity</th><th>関係</th></tr>
  <tr><td>契約照会サービス（架空）</td><td><b>38</b></td><td>${sev('high')}</td><td>エピソードの対象</td></tr>
  <tr><td>代理店ポータル（架空）</td><td><b>71</b></td><td>${sev('low')}</td><td>契約照会を利用</td></tr>
  <tr><td>顧客マイページ（架空）</td><td><b>96</b></td><td>${sev('normal')}</td><td>影響なし</td></tr></table>
  <div style="display:flex;gap:30px;margin-top:14px;font-size:15.5px"><div data-k="impWrap"><span style="color:var(--sub)">影響の範囲</span><span class="qm" data-k="impQ">?</span>　<b>代理店ポータルの照会の一部（架空）</b></div></div>
  <div style="margin-top:14px;font-size:15px;color:var(--sub)">関連エンティティ</div><div style="margin-top:6px;display:flex;gap:12px;align-items:center"><span class="chipe">🖥 ctr-db-01（架空）</span><span class="chipe">🖥 ctr-app-01（架空）</span><span class="lnk" data-k="entLink">Entity Overview で開く ›</span></div>`;
 else body=`<table class="et"><tr><th>時刻</th><th>Severity</th><th>内容（Notable event）</th></tr>
  <tr><td>10:02:31</td><td>${sev('high')}</td><td>応答時間（p95）がしきい値を超えました（架空）</td></tr>
  <tr><td>10:03:10</td><td>${sev('high')}</td><td>DB接続待ち時間がしきい値を超えました（架空）</td></tr>
  <tr><td>10:06:44</td><td>${sev('medium')}</td><td>エラー率が上昇しました（架空）</td></tr>
  <tr><td>10:11:02</td><td>${sev('low')}</td><td>代理店ポータルの健全性スコアが低下しました（架空）</td></tr></table>`;
 return `<div class="crumb">IT Service Intelligence ＞ Episode Review</div><div class="h1">Episode Review <small>エピソード（関連するアラートのまとまり）の確認</small></div>
 <div class="erw"><div class="elist"><div class="filt"><div class="fd">Status　<b>All ▾</b></div><div class="fd">Time　<b>Last 24 hours ▾</b></div></div>
 ${eps.map(e=>`<div class="ec ${e.sel?'sel':''}" style="border-left-color:${SEVC[e.s]}"><span>${e.id}</span><b>${e.t}</b><span>${e.m}</span></div>`).join('')}</div>
 <div class="edet"><div data-k="epHead"><div class="eid">E-0412　${sev('high')}</div><div class="etitle">契約照会サービス（架空）の応答時間の悪化</div><div class="emeta">開始 10:02　｜　最新のイベント 10:17　｜　イベント 38件　｜　対象 契約照会サービス（架空）</div></div>
 <div class="ectl"><span class="sel2">Severity <b>High ▾</b></span><span style="display:inline-flex;gap:10px" data-k="epStatus"><span class="sel2">Status <b>${st.erStatus} ▾</b></span><span class="sel2">Owner <b>${st.erOwner} ▾</b></span></span><span class="abtn ${st.erStatus==='New'?'':'g'}" data-k="ackBtn">${st.erStatus==='New'?'Acknowledge':'Acknowledged ✓'}</span><span class="abtn g">Actions ▾</span></div>
 <div class="tabs">${tabs.map(t=>`<span class="tab ${(t[1]==='tabImpact'&&st.erTab==='impact')||(t[1]==='tabEvents'&&st.erTab==='events')?'on':''}" ${t[1]?`data-k="${t[1]}"`:''}>${t[0]}</span>`).join('')}</div>${body}</div></div>`;},
ite(st){
 const vals=[];for(let i=0;i<=50;i++){let v=i<28?182+((i*37)%13)-6:Math.min(486,182+(i-28)*26+((i*17)%11));if(i>40)v=476+((i*13)%11);vals.push(v);}
 const w=1290,h=210,x=i=>40+i/50*(w-60),y=v=>h-24-(v/550)*(h-40);
 const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
 const ticks=[0,10,20,30,40,50].map(i=>`<text x="${x(i)}" y="${h-4}" font-size="13" fill="#6b7280" text-anchor="middle">${['09:30','09:40','09:50','10:00','10:10','10:20'][i/10]}</text>`).join('');
 return `<div class="crumb">IT Essentials Work ＞ Entity Overview ＞ ctr-db-01（架空）</div><div class="h1">ctr-db-01（架空） <small>エンティティの状態（Analytics）</small></div>
 <div style="font-size:14.5px;color:var(--sub);margin:-6px 0 12px">種類：*nix（架空）｜役割：契約DBサーバー（架空）｜関連サービス：契約照会サービス（架空）</div>
 <div class="vit"><div class="vc"><span>CPU使用率</span><b>34 %</b><small>過去60分の平均</small></div><div class="vc"><span>メモリ使用率</span><b>71 %</b><small>過去60分の平均</small></div><div class="vc"><span>ディスクI/O待ち</span><b>12 ms</b><small>過去60分の平均</small></div>

function tt(t){
 if(!t)return '';
 const ai=t.kind==='ai';
 let h=`<div class="ttp ${ai?'ai':''}" data-k="ttp"><span class="chip">${ai?'テックタッチ＋AI Hub':'テックタッチ'}</span><span class="lbl">${t.lbl||'ガイド（案）'}</span><h3>${t.title}</h3>`;
 if(t.mode==='aionly'){if(t.ai)h+=`<div class="aibox"><b>AI Hub（例文）</b>${t.ai}</div>`;if(t.asst)h+=`<div class="asst">${t.asst}</div>`;}
 else if(t.mode==='list'){h+=`<div class="dsc">${t.dsc}</div>${t.items.map((it,i)=>`<div class="git ${i===0?'on':''}"><b>${it[0]}</b><span>${it[1]}</span></div>`).join('')}`;}
 else{
  h+=`<ul class="steps">${t.steps.map((s,i)=>`<li class="${t.cur==null||i<t.cur||t.mode==='done'?(t.cur==null&&t.mode!=='done'?'':'ok'):i===t.cur?'cur':''}"><span class="d">${(t.cur!=null&&i<t.cur)||t.mode==='done'?'✓':i+1}</span>${s}</li>`).join('')}</ul>`;
  if(t.msg)h+=`<div class="msg">${t.msg}</div>`;
  if(t.warn)h+=`<div class="warn">${t.warn}</div>`;
  if(t.ttg)h+=`<div class="ttg"><b><span>テックタッチ 操作ガイド</span><span>${t.cur+1} / ${t.steps.length}</span></b>${t.ttg}</div>`;
  if(t.chk)h+=`<div class="chk">${t.chk.map(c=>`<div>${c}</div>`).join('')}</div>`;
  if(t.rec)h+=`<div class="rec">${t.rec.map(r=>`<div><b>${r[0]}</b>${r[1]}</div>`).join('')}</div>`;
  if(t.ai)h+=`<div class="aibox"><b>AI Hub（例文）</b>${t.ai}</div>`;
  if(t.why)h+=`<div class="why">${t.why}</div>`;
  if(t.asst)h+=`<div class="asst">${t.asst}</div>`;
 }
 if(t.note)h+=`<div class="note">${t.note}</div>`;
 h+=t.btn?`<div class="btns"><span class="btn2">戻る</span><span class="btn1" data-k="ttBtn">${t.btn}</span></div></div>`:'</div>';
 return h;}

/* ---------- engine ---------- */
const scene=document.getElementById('scene'),ov=document.getElementById('ov'),qv=document.getElementById('q'),capEl=document.getElementById('cap'),cursor=document.getElementById('cursor'),rip=document.getElementById('rip');
let STATES=[],STARTS=[],POS=[],TOTAL=0,curIdx=-1,LAY=[];
function buildStates(){let c={cur:null};STATES=[];STARTS=[];let t=0;
 for(const st of STEPS){const n=Object.assign({},c,TRANS,{ring:null},st.s);if(!('c1' in st.s))n.c1=c.c1;if(!('c1' in st.s)&&!('note' in st.s))n.note=c.note;STATES.push(n);STARTS.push(t);t+=st.d;c=n;}
 TOTAL=t;}
function renderScene(st){
 if(st.card){scene.innerHTML=card(st.card);}
 else{let h=chbar(st.ch)+hdr(st.hdr!=null?st.hdr:st.ch)+win(st);scene.innerHTML=h;
  if(st.chat2&&st.view!=='shot'){const m=scene.querySelector('.main')||scene.querySelector('.shotc');m.insertAdjacentHTML('beforeend',`<div style="position:absolute;left:26px;right:26px;top:70px;z-index:6">${chat(CHATS[st.chat2])}</div>`);}}
 qv.innerHTML=st.q?qhtml(st.q):'';
 const c1=capEl.querySelector('.c1'),c2=capEl.querySelector('.c2');
 if(st.c1&&(!st.card||st.card.type==='summary')){capEl.style.display='block';c1.textContent=st.c1;c2.textContent=(st.note?st.note+'　':'')+(st.view==='shot'?(st.hdr===4?NOTE_PROOF:NOTE_REAL):NOTE);}else capEl.style.display='none';
 if(st.q)capEl.style.display='none';
}
function rectOf(k){if(k==='kpiBad'){const a=rectOf('kpiBad1'),b=rectOf('kpiBad2');return a&&b?{left:a.left,top:a.top,right:a.right,bottom:b.bottom,width:a.width,height:b.bottom-a.top}:null;}
 const e=scene.querySelector(`[data-k="${k}"]`);if(!e)return null;const r=e.getBoundingClientRect();return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height};}
function layout(st){
 const L={};
 if(st.hl){const r=rectOf(st.hl);if(r)L.ring={x:r.left-5,y:r.top-5,w:r.width+10,h:r.height+10,cls:st.ring||(st.tt&&st.tt.kind==='ai'&&!st.card?'':'')};}
 if(st.bal){const r=rectOf(st.bal.k||st.hl);if(r)L.bal={r,b:st.bal};}
 if(st.tip){const r=rectOf(st.tip.k);if(r)L.tip={r,t:st.tip};}
 if(st.cur){if(Array.isArray(st.cur))L.cur=st.cur;else{const r=rectOf(st.cur);if(r)L.cur=[r.left+Math.min(r.width*0.5,r.width-8),r.top+r.height*0.55];}}
 return L;}
function drawOv(st,L){
 let h='';
 if(L.ring)h+=`<div class="ring ${L.ring.cls||''}" style="left:${L.ring.x}px;top:${L.ring.y}px;width:${L.ring.w}px;height:${L.ring.h}px"></div>`;
 if(L.bal){const {r,b}=L.bal,p=b.p||'b';let pos;
  if(p==='b')pos=`left:${Math.max(40,r.left)}px;top:${r.bottom+14}px`;
  else if(p==='br')pos=`right:${1920-r.right}px;top:${r.bottom+14}px`;
  else if(p==='t')pos=`left:${Math.max(40,r.left)}px;bottom:${1080-r.top+14}px`;
  else if(p==='r')pos=`left:${r.right+16}px;top:${r.top}px`;
  else pos=`right:${1920-r.left+16}px;top:${r.top}px`;
  h+=`<div class="bal ${p} ${b.ai?'ai':''}" style="${pos}">${b.t}${b.s?`<small>${b.s}</small>`:''}</div>`;}
 if(L.tip){const {r,t}=L.tip,p=t.p||'b';let pos;
  if(p==='l')pos=`right:${1920-r.left+14}px;top:${r.top-10}px`;else if(p==='r')pos=`left:${r.right+14}px;top:${r.top-30}px`;else pos=`left:${r.left-20}px;top:${r.bottom+12}px`;
  h+=`<div class="tip" style="${pos}"><b>${t.h}</b>${t.t}</div>`;}
 ov.innerHTML=h;}
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,cl=x=>Math.max(0,Math.min(1,x));
async function init(){
 buildStates();await document.fonts.ready;
 const shots=[...new Set(STATES.filter(s=>s.view==='shot').map(s=>s.shot))];
 await Promise.all(shots.map(f=>new Promise(res=>{const im=new Image();im.onload=()=>{IMGSZ[f]={w:im.naturalWidth,h:im.naturalHeight};res();};im.onerror=()=>{console.log('missing screenshot: '+f);res();};im.src=SHOTDIR+f;})));
 for(let pass=0;pass<2;pass++){LAY=[];POS=[];let p=[1500,900];
  for(let i=0;i<STATES.length;i++){renderScene(STATES[i]);const L=layout(STATES[i]);LAY.push(L);if(L.cur)p=L.cur;POS.push(p);}
  await document.fonts.ready;await new Promise(r=>setTimeout(r,300));}
 curIdx=-1;return TOTAL;}
function seek(t){
 let i=STARTS.length-1;while(i>0&&STARTS[i]>t)i--;
 const st=STATES[i],lt=t-STARTS[i];
 if(i!==curIdx){renderScene(st);drawOv(st,LAY[i]);curIdx=i;}
 // fades
 const a=cl(lt/0.3);ov.style.opacity=a;
 const cardA=st.card&&(i===0||!STATES[i-1].card||STATES[i-1].card.type!==st.card.type)?cl(lt/0.45):1;scene.style.opacity=cardA;
 qv.style.opacity=st.q?cl(lt/0.4):0;
 // cursor
 const from=i>0?POS[i-1]:POS[0],to=POS[i];const e=ease(cl((lt-0.25)/0.95));
 const x=from[0]+(to[0]-from[0])*e,y=from[1]+(to[1]-from[1])*e;
 const hide=!!st.card&&st.card.type!=='summary'||!!st.q||st.view==='shot';
 cursor.style.display=hide?'none':'block';cursor.style.transform=`translate(${x-3}px,${y-2}px)`;
 let rp=0;if(st.click&&!hide){rp=cl((lt-1.35)/0.45);}
 if(rp>0&&rp<1){const R=10+38*rp;rip.style.display='block';rip.style.left=(to[0]-R)+'px';rip.style.top=(to[1]-R)+'px';rip.style.width=rip.style.height=2*R+'px';rip.style.opacity=1-rp;rip.style.borderColor=st.ring==='ai'||st.bal&&st.bal.ai?'var(--ai)':'var(--tt)';}else rip.style.display='none';
 return `${i}|${x.toFixed(0)},${y.toFixed(0)}|${a.toFixed(2)}|${cardA.toFixed(2)}|${qv.style.opacity}|${rp>0&&rp<1?rp.toFixed(2):0}`;}
window.DEMO={init,seek,get total(){return TOTAL},get starts(){return STARTS}};
</script>
